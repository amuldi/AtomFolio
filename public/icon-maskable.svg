<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="AtomFolio">
  <!-- Maskable PWA icon: solid background fills the full square (OS-applied masks — circle,
       squircle, rounded-square — crop from the edges inward), with the atom mark kept inside the
       ~80% "safe zone" so nothing important gets clipped regardless of which mask shape a given
       OS applies. Same mark as favicon.svg, just re-centered/scaled into that safe zone and given
       an explicit dark fill (favicon.svg's transparent background relies on prefers-color-scheme,
       which doesn't apply the same way once this is composited onto a home-screen/OS background). -->
  <rect width="512" height="512" fill="#050403" />
  <g transform="translate(256 256) scale(5.2) translate(-32 -32)">
    <g>
      <path fill="none" stroke="#fff8e9" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.4" d="M 9.5 30.5 C 16 22.5 32 22 45 27 C 56 31.5 57 39 47 42 C 36 45.5 19 41.5 11.5 35 C 8 32 7.8 31.8 9.5 30.5 Z" />
      <path fill="none" stroke="#fff8e9" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.4" d="M 25 10.5 C 34 13 40 24 42 36 C 44 50 39.5 58 32.5 55 C 25 51.8 21 38 20.5 26 C 20 16 21.8 10.2 25 10.5 Z" />
      <path fill="none" stroke="#fff8e9" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.4" d="M 47 13.5 C 51 20.5 43 32.5 33 42 C 23.5 51 12.5 53 10.5 47 C 8.2 40 19.5 28.5 28.5 20.5 C 37 13 44.5 9 47 13.5 Z" />
    </g>
    <g>
      <circle fill="#ffc782" cx="32.8" cy="32.2" r="4.6" />
      <circle fill="#fff8e9" cx="55.5" cy="35.5" r="2.6" />
      <circle fill="#fff8e9" cx="25" cy="10.4" r="2.5" />
      <circle fill="#fff8e9" cx="13.8" cy="48.5" r="2.5" />
    </g>
  </g>
</svg>
